<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 13</title>
<style>
  .box {
    background-color: pink;
    margin-bottom: 30px;
    font-family: "Times New Roman", serif;
    font-size: 20px;
  }

  #sq1 {
    width: 100px;
    height: 100px;
    transition: width 1s;
  }
  #sq1:hover {
    width: 600px;
  }

  #sq2 {
    width: 100px;
    height: 100px;
    transition: width 1s, height 1s;
  }
  #sq2:hover {
    width: 140px;
    height: 140px;
  }
</style>
</head>
<body>
  <div class="box" id="sq1">1</div>
  <div class="box" id="sq2">2</div>
</body>
</html>
